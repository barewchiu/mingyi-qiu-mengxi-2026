  <style>

      --line: #e6dfd4; --accent: #2f6f4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #efe8dc 0%, var(--bg) 40%, #f8f6f2 100%);

    .meta { color: var(--muted); font-size: 0.95rem; }
    .note {
      max-width: 920px; margin: 8px auto 12px; padding: 12px 16px;
      background: #fff8e8; border: 1px solid #f0e0b8; border-radius: 10px;
      color: #6a5420; font-size: 0.92rem;
    }
    main { max-width: 920px; margin: 0 auto 48px; padding: 0 20px; display: grid; gap: 18px; }
    section {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; box-shadow: 0 8px 24px rgba(40, 30, 10, 0.04);
    }
    figure { margin: 0; }
    img { width: 100%; height: auto; display: block; border-radius: 10px; background: #eee; }
    figcaption { margin-top: 8px; color: var(--muted); font-size: 0.92rem; }
    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 0 20px 40px; }
  </style>
</head>
