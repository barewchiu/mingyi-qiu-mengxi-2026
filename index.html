<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>明毅家庭申报材料 · 邱梦汐</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #fff;
      --ink: #1f1a14;
      --muted: #6b6258;
      --line: #e6dfd4;
      --accent: #2f6f4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #efe8dc 0%, var(--bg) 40%, #f8f6f2 100%);
      color: var(--ink);
      line-height: 1.6;
    }
    header {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 20px 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .note {
      max-width: 920px;
      margin: 8px auto 20px;
      padding: 12px 16px;
      background: #fff8e8;
      border: 1px solid #f0e0b8;
      border-radius: 10px;
      color: #6a5420;
      font-size: 0.92rem;
    }
    main {
      max-width: 920px;
      margin: 0 auto 48px;
      padding: 0 20px;
      display: grid;
      gap: 18px;
    }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(40, 30, 10, 0.04);
    }
    section h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      color: var(--accent);
    }
    figure { margin: 0; }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      background: #eee;
    }
    figcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .links a {
      color: var(--accent);
      word-break: break-all;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0 20px 40px;
    }
  </style>
</head>
<body>
